<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Realmforge gallery</title>
    <style>
      html, body { margin: 0; height: 100%; background: #15161a; color: #e8e2d0; font: 14px system-ui, sans-serif; }
      #app { display: grid; grid-template-columns: 260px 1fr; height: 100%; }
      nav { overflow: auto; border-right: 1px solid #2a2c33; padding: 12px; }
      nav h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #a99c78; margin: 16px 0 6px; }
      nav a { display: block; color: inherit; text-decoration: none; padding: 4px 6px; border-radius: 4px; }
      nav a.active, nav a:hover { background: #2a2c33; }
      #stage { position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"><nav id="nav"></nav><div id="stage"></div></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
